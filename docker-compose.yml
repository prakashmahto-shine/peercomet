# Runs the PeerPath image on a single machine (VM). All settings come from .env;
# see .env.example and docs/DEPLOYMENT.md. The database is external (DATABASE_URL).
#
#   docker compose up -d --build
services:
  app:
    build: .
    image: peerpath:latest
    env_file: .env
    ports:
      - "5001:5001"
    volumes:
      # Session recordings when RECORDINGS_STORAGE=local
      - recordings:/app/backend/data/recordings
    restart: unless-stopped

volumes:
  recordings:
