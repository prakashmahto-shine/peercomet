# Full PeerPath stack on one server (e.g. the Yotta staging VM). Everything is configured
# from .env (copy .env.example). See docs/DEPLOYMENT.md, "Single-server setup".
#
#   docker compose up -d --build
#
# Optional parts are enabled with COMPOSE_PROFILES in .env:
#   caddy  - HTTPS + reverse proxy on ports 80/443 (skip if the server already runs nginx)
#   turn   - coturn TURN server for video calls behind strict NATs/firewalls
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: peerpath
      POSTGRES_USER: peerpath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peerpath -d peerpath"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    # Shared server: cap what PeerPath can take from other apps
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  app:
    build: .
    image: peerpath:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql://peerpath:${POSTGRES_PASSWORD}@postgres:5432/peerpath
      CORS_ORIGINS: https://${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      TURN_URLS: ${TURN_URLS:-turn:${SITE_DOMAIN}:3478}
    ports:
      # Only reachable from the server itself (Caddy or the host's nginx forwards to it)
      - "127.0.0.1:5001:5001"
    volumes:
      # Session recordings when RECORDINGS_STORAGE=local
      - recordings:/app/backend/data/recordings
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3g

  # Daily database backup into ./backups on the host (kept BACKUP_KEEP_DAYS days).
  # Copy ./backups to storage outside this server as well.
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: peerpath
      PGDATABASE: peerpath
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/peerpath-$$(date -u +%Y%m%dT%H%M%SZ).dump
          if pg_dump --format=custom --no-owner --file="$$f"; then echo "backup ok: $$f"; else echo "backup FAILED"; rm -f "$$f"; fi
          find /backups -name 'peerpath-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  caddy:
    profiles: ["caddy"]
    image: caddy:2.8-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  coturn:
    profiles: ["turn"]
    image: coturn/coturn:4.6.2
    # TURN relays media over a UDP port range; host networking avoids publishing each port
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --lt-cred-mech
      - --realm=${SITE_DOMAIN}
      - --user=${TURN_USERNAME:?set TURN_USERNAME in .env}:${TURN_CREDENTIAL:?set TURN_CREDENTIAL in .env}
      - --external-ip=${SERVER_PUBLIC_IP:?set SERVER_PUBLIC_IP in .env}
      - --no-cli
      - --no-tls
      - --no-dtls
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata:
  recordings:
  caddy_data:
  caddy_config:
